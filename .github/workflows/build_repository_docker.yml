name: build_repository_docker

on:
  workflow_call:
    inputs: &shared_inputs
      base_image:
        description: 'Base Docker image to build FROM'
        required: false
        type: string
      output_image:
        description: 'Docker image to output'
        required: false
        type: string
      platform:
        description: 'Target platform(s) for docker buildx (e.g. linux/amd64 or linux/amd64,linux/arm64)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      wait_for_ppa:
        description: 'Wait for PPA before building'
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB:
        required: true
      PUSH_TOKEN:
        required: true

  workflow_dispatch:
    inputs: *shared_inputs

env:
  BASE_IMAGE: ${{ inputs.base_image || 'ctumrs/ros_jazzy:latest' }}
  VARIANT: unstable
  OUTPUT_IMAGE: ${{ inputs.output_image || format('ctumrs/{0}:unstable', github.event.repository.name) }}
  DOCKERHUB: ${{secrets.DOCKERHUB}}
  PUSH_TOKEN: ${{secrets.PUSH_TOKEN}}

jobs:
  build-docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 360 # 6 hour timeout
    env:
      DOCKERHUB: ${{secrets.DOCKERHUB}}
      PUSH_TOKEN: ${{secrets.PUSH_TOKEN}}
    steps:
      - name: Wait for PPA
        if: ${{ inputs.wait_for_ppa }}
        run: sleep 300

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: 'recursive'
      - name: Checkout CI scripts
        uses: actions/checkout@v6
        with:
          repository: ctu-mrs/ci_scripts
          ref: ros2
          path: ci_scripts
          token: ${{secrets.PUSH_TOKEN}}
      - id: build
        run: ./ci_scripts/docker/build_repository_image/build.sh ${{env.BASE_IMAGE}} ${{env.VARIANT}} ${{env.OUTPUT_IMAGE}} ./docker ${{ inputs.platform }}
